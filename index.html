<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almoxarifado Tecnológico</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Almoxarifado Tecnológico</h1>
      <nav>
        <button data-section="dashboard">Dashboard</button>
        <button data-section="produtos">Produtos</button>
        <button data-section="adicionar">Adicionar</button>
        <button data-section="categorias">Categorias</button>
        <button data-section="emprestimos">Empréstimos</button>
      </nav>
    </header>

    <main>
      <section id="dashboard" class="section active">
        <h2>Dashboard</h2>
        <div id="dashboard-cards"></div>
        <h3>Estoque por categoria</h3>
        <div id="category-summary"></div>
      </section>

      <section id="produtos" class="section">
        <h2>Produtos</h2>
        <input
          id="search-input"
          type="search"
          placeholder="Pesquisar por nome, código ou categoria..."
        />
        <select id="category-filter">
          <option value="">Todas as categorias</option>
        </select>
        <div id="product-list"></div>
      </section>

      <section id="adicionar" class="section">
        <h2>Adicionar produto</h2>
        <form id="product-form">
          <input id="name" required placeholder="Nome do componente" />
          <input id="code" required placeholder="Código / patrimônio" />
          <select id="category" required></select>
          <input
            id="quantity"
            required
            type="number"
            min="0"
            placeholder="Quantidade"
          />
          <input
            id="minimum"
            required
            type="number"
            min="0"
            placeholder="Estoque mínimo"
          />
          <input id="location" placeholder="Localização (ex.: Armário A)" />
          <textarea id="description" placeholder="Descrição"></textarea>
          <button type="submit">Salvar produto</button>
        </form>
      </section>

      <section id="categorias" class="section">
        <h2>Categorias</h2>
        <form id="category-form">
          <input id="category-name" required placeholder="Nova categoria" />
          <button type="submit">Adicionar categoria</button>
        </form>
        <ul id="category-list"></ul>
      </section>

      <section id="emprestimos" class="section">
        <h2>Empréstimos</h2>

        <div id="loan-list"></div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
